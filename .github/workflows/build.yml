name: DIYP电视构建

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Build 老盒子版本
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleArmeabiGenericNormalRelease --build-cache --parallel --warning-mode all
      - name: Prepare App
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          find . -name "*.apk" -exec cp {} ${{ github.workspace }}/apk/ \;
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diyp-tv-apk
          path: ${{ github.workspace }}/apk/*
